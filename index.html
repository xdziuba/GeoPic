<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="author" content="Paweł Dziuba, Mikołaj Bębenek">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GeoPic 🌍📸</title>

    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <link rel="stylesheet" href="src/css/style.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous" defer></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js" defer></script>
    <script type="module" src="src/js/app.js" defer></script>
  </head>

  <body>
    <div id="app" class="container py-4">
      <div class="row">
        <div class="col-auto">
          <img src="assets/android-chrome-512x512.png" alt="GeoPic Logo" width="64" height="64">
        </div>

        <div class="col mb-5">
          <h1>GeoPic 🌍📸</h1>
          <p class="lead">Udostępniaj zdjęcia z lokalizacją GPS!</p>
        </div>
      </div>

      <div class="alert alert-info" role="alert">
        Aplikacja jest w fazie rozwoju, więc mogą wystąpić błędy. Jeśli masz pomysł na funkcję lub znalazłeś błąd, zgłoś to na <a href="https://github.com/xdziuba/geopic" target="_blank">stronie projektu</a>.
      </div>

      <!-- New post form -->
      <div class="card p-3 mb-4">
        <h2 class="mb-3">Nowy post:</h2>
        <input type="file" @change="handleFile" class="form-control mb-2" accept="image/*" capture="environment"/>
        <input type="text" v-model="description" class="form-control mb-2" placeholder="Opis...">
        <button class="btn btn-primary" @click="addPost">Dodaj zdjęcie</button>
      </div>

      <!-- Posts -->
      <div class="card p-3 mb-4">
          <h2 class="mb-3">Feed:</h2>
      
        <div v-for="post in posts" class="card mb-3">
          <img :src="post.imageUrl" class="card-img-top">
          <div class="card-body">
            <p>📍 Lat: {{ post.lat.toFixed(3) }}, Lng: {{ post.lng.toFixed(3) }}</p>
            <p>💬 {{ post.description }}</p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
